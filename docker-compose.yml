services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    environment:
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      - MUSE2API_PUBLIC_BASE=
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
      - MUSE2API_CONCURRENCY=2
    volumes:
      - ./data:/app/data
    shm_size: '2gb'
    networks:
      - default
      - autopost_default

networks:
  default:
  autopost_default:
    external: true
